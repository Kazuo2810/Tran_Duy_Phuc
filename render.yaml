services:
  - type: web
    name: iris-idp-sso
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn auth_app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        fromDatabase:
          name: iris-shared-db
          property: connectionString
      - key: IDP_ISSUER
        value: https://iris-idp-sso.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: OAUTH_CLIENTS_JSON
        sync: false
      - key: ACCESS_TOKEN_HOURS
        value: "8"

  - type: web
    name: iris-web-svm
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: DATABASE_URL
        fromDatabase:
          name: iris-shared-db
          property: connectionString
      - key: IDP_ISSUER
        value: https://iris-idp-sso.onrender.com
      - key: AUTH_SERVICE_URL
        value: https://iris-idp-sso.onrender.com
      - key: JWT_SECRET
        sync: false
      - key: OAUTH_CLIENT_ID
        value: iris-web-svm
      - key: OAUTH_CLIENT_SECRET
        sync: false
      - key: OAUTH_REQUIRED_SCOPE
        value: iris:access
      - key: EXPORT_SECRET
        sync: false

databases:
  - name: iris-shared-db
    plan: free
    databaseName: irisdb
    user: irisuser
