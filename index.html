<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Phân loại Hoa Iris - Trần Duy Phúc</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #74ebd5 0%, #ACB6E5 100%);
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: white;
            padding: 40px;
            border-radius: 15px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
            text-align: center;
            width: 350px;
        }
        h2 { color: #2c3e50; margin-bottom: 5px; }
        p { color: #7f8c8d; font-size: 14px; margin-bottom: 20px; }
        input {
            width: 90%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #bdc3c7;
            border-radius: 5px;
            font-size: 14px;
        }
        button {
            background-color: #27ae60;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
            font-weight: bold;
            width: 100%;
            margin-top: 15px;
            transition: 0.3s;
        }
        button:hover { background-color: #2ecc71; }
        #result {
            margin-top: 20px;
            font-size: 18px;
            font-weight: bold;
            color: #e74c3c;
            min-height: 25px;
        }
    </style>
</head>
<body>

    <div class="container">
        <h2>🌸 Nhận diện Hoa Iris</h2>
        <p>Mô hình SVM - Phát triển bởi Trần Duy Phúc</p>
        
        <input type="number" id="sl" placeholder="Chiều dài đài hoa (vd: 5.1)">
        <input type="number" id="sw" placeholder="Chiều rộng đài hoa (vd: 3.5)">
        <input type="number" id="pl" placeholder="Chiều dài cánh hoa (vd: 1.4)">
        <input type="number" id="pw" placeholder="Chiều rộng cánh hoa (vd: 0.2)">
        
        <button onclick="duDoan()">DỰ ĐOÁN NGAY</button>
        
        <div id="result"></div>
    </div>

    <script>
        function duDoan() {
            const ketQuaDiv = document.getElementById('result');
            ketQuaDiv.style.color = '#34495e';
            ketQuaDiv.innerText = "Đang phân tích dữ liệu...";

            // Lấy dữ liệu từ các ô nhập
            const data = {
                sepal_length: parseFloat(document.getElementById('sl').value),
                sepal_width: parseFloat(document.getElementById('sw').value),
                petal_length: parseFloat(document.getElementById('pl').value),
                petal_width: parseFloat(document.getElementById('pw').value)
            };

            // Gọi API máy chủ Render của bạn
            fetch("https://tran-duy-phuc.onrender.com/predict", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(data => {
                ketQuaDiv.style.color = '#e74c3c';
                // In kết quả dự đoán ra màn hình
                ketQuaDiv.innerText = "Kết quả: Hoa " + data.prediction.toUpperCase() + "!";
            })
            .catch(error => {
                ketQuaDiv.innerText = "Lỗi kết nối máy chủ!";
                console.error(error);
            });
        }
    </script>

</body>
</html>
